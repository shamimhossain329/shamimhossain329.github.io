<style>
:root{--wall:#e6e1d8;--wall2:#cdc6ba;--floor:#bab2a5;--floor2:#9d958a;--ink:#1d1b19;--muted:#6a645b;--paper:#fbf9f5;--pi:#1d1b19;--line:rgba(40,34,26,.2);--accent:#1f5a4b;--soft:rgba(31,90,75,.1);--dim:rgba(20,17,13,.62);--btntext:#fff;--led:#8c7b62;--led2:#8c7b62;--glass:rgba(251,249,245,.88);--lit:0;--serif:"Syne","Manrope",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#1f1d1b;--wall2:#100f0e;--floor:#181614;--floor2:#0b0a09;--ink:#efe9de;--muted:#b0a898;--paper:#1d1b19;--pi:#efe9de;--line:rgba(239,233,222,.2);--accent:#8fcab4;--soft:rgba(143,202,180,.12);--dim:rgba(0,0,0,.74);--btntext:#10201b;--led:#b5a688;--led2:#b5a688;--glass:rgba(32,30,28,.9)}}
:root[data-theme="dark"]{--wall:#1f1d1b;--wall2:#100f0e;--floor:#181614;--floor2:#0b0a09;--ink:#efe9de;--muted:#b0a898;--paper:#1d1b19;--pi:#efe9de;--line:rgba(239,233,222,.2);--accent:#8fcab4;--soft:rgba(143,202,180,.12);--dim:rgba(0,0,0,.74);--btntext:#10201b;--led:#b5a688;--led2:#b5a688;--glass:rgba(32,30,28,.9)}
*{box-sizing:border-box;margin:0}
html{background:var(--wall2)}
html.inroom,html.inroom body{overflow:hidden;height:100%}
body{background:var(--wall2);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
@keyframes fade{from{opacity:0}}
.scene{display:none}
.scene.on{display:block;animation:fade .6s both}
/* door */
.hall{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 15vh;overflow:hidden;background:linear-gradient(var(--wall),var(--wall2));transition:opacity .6s}
.hall.fade{opacity:0}

.hall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13vh;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(255,255,255,.07) 70px 71px),linear-gradient(var(--floor),var(--floor2));border-top:1px solid rgba(255,255,255,.25)}
.cap{position:absolute;z-index:2;top:calc(18px + env(safe-area-inset-top,0px));font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.cap.l{left:20px}.cap.r{right:20px}
.sun{position:absolute;z-index:0;width:min(104vw,450px);aspect-ratio:1;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-58%);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.dw{position:relative;z-index:1;perspective:1200px;width:min(68vw,280px,calc((100svh - 210px)/1.85))}
.dframe{position:relative;padding:10px 10px 0;border-radius:999px 999px 0 0;background:linear-gradient(#f6f1e7,#d9d1c1);box-shadow:0 34px 50px -20px rgba(0,0,0,.55)}
.opening{aspect-ratio:1/1.85;border-radius:999px 999px 0 0;background:radial-gradient(ellipse at 50% 85%,#ffe9bd,#e3b068 48%,#4d3213)}
.door{position:absolute;left:10px;top:10px;right:10px;bottom:0;border-radius:999px 999px 0 0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:9% 9% 7%;text-align:center;color:#f7f1e6;transform-origin:left center;transition:transform 1.1s cubic-bezier(.5,0,.2,1);background:repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 2px,transparent 2px 18px),linear-gradient(180deg,#27665a,#10352c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -50px 70px rgba(0,0,0,.28)}
.door::before{content:"";position:absolute;inset:11px 11px 0;border-radius:999px 999px 0 0;border:1px solid rgba(255,255,255,.2);pointer-events:none}
.door.open{transform:rotateY(-105deg)}
.door:not(.open){animation:ajar 6s ease-in-out infinite}
@keyframes ajar{50%{transform:rotateY(-3.5deg)}}
.pt{width:66%;aspect-ratio:3/3.7;border-radius:999px 999px 10px 10px;overflow:hidden;flex:none;border:3px solid #f1ebdf;box-shadow:0 14px 26px rgba(0,0,0,.45)}
.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.plate{margin-top:4px;font-family:var(--serif);font-weight:800;font-size:clamp(22px,7.4vw,31px);line-height:.98;letter-spacing:-.015em;text-transform:uppercase;color:#f8f2e7}
.plate small{display:block;font-size:11px;font-weight:700;letter-spacing:.32em;opacity:.8;margin-bottom:4px}
.dsub{min-height:2.7em;display:grid;align-content:center;font-weight:600;font-size:clamp(11.5px,3.3vw,13px);line-height:1.45;color:rgba(247,241,230,.86);transition:opacity .35s}
.dsub.sw{opacity:0}
.dloc{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,241,230,.6)}
.knob{position:absolute;right:11%;top:60%;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbc4b6 55%,#6d675c);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.knob::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ping 1.9s ease-out infinite}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.5);opacity:0}}
.hint{position:relative;z-index:1;margin-top:26px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.hint::after{content:"";display:block;width:34px;height:2px;margin:8px auto 0;background:var(--accent);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:scaleX(1.8)}}
/* door life */
.plate{animation:plate 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes plate{from{opacity:0;transform:translateY(16px);letter-spacing:.08em}}
.pt{animation:ptin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ptin{from{opacity:0;transform:scale(.82)}}
/* room */
.rm{position:fixed;inset:0;background:linear-gradient(var(--wall),var(--wall2));overflow:hidden}
.rm.lit{--lit:1}
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.track::-webkit-scrollbar{display:none}
.track.lock{overflow-x:hidden}
.seg{position:relative;flex:none;width:100vw;height:100%;overflow:hidden;scroll-snap-align:center;scroll-snap-stop:always;background:linear-gradient(transparent calc(58% - 2px),rgba(255,255,255,.14) calc(58% - 2px),rgba(0,0,0,.2) 58%,transparent 58%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}
.seg::before{content:"";position:absolute;left:0;top:0;bottom:24%;width:2px;background:var(--led);opacity:calc(var(--lit)*.6);transition:opacity 1s .3s}
.seg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(255,255,255,.07) 70px 71px),linear-gradient(var(--floor),var(--floor2));border-top:1px solid rgba(255,255,255,.22)}
.bgw{position:absolute;left:50%;top:13%;font:800 38vw/1 var(--serif);letter-spacing:-.05em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 13%,transparent);white-space:nowrap;pointer-events:none;transform:translateX(calc(-50% + (var(--i)*100vw - var(--sl,0px))*.32))}
.orb{position:absolute;left:50%;top:47%;width:min(98vw,410px);aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--accent) 13%,transparent);pointer-events:none;transform:translate(calc(-50% + (var(--i)*100vw - var(--sl,0px))*.14),-50%)}
.lamp{position:absolute;z-index:1;top:0;left:50%;width:2px;height:11%;background:#8a8378}
.lamp::after{content:"";position:absolute;bottom:-12px;left:-12px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff6d6,#ffd88a 60%,transparent 72%);opacity:var(--lit);transition:opacity 1s .2s;box-shadow:0 0 40px 16px rgba(255,232,180,.2)}
.plq{position:absolute;z-index:2;left:50%;top:50%;display:block;width:min(64vw,250px);padding:10px 10px 0;border-radius:999px 999px 0 0;background:linear-gradient(#f6f1e7,#d9d1c1);box-shadow:0 30px 44px -20px rgba(0,0,0,.6);perspective:900px;transform:translate(-50%,-50%);text-align:center;color:#f7f1e6}
.seg:not(.cur) .plq{opacity:.8}
.seg.cur .plq{animation:plin .85s cubic-bezier(.2,.8,.2,1) both}
@keyframes plin{from{transform:translate(-50%,-42%) scale(.92);opacity:.3}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.plq .gl{position:absolute;left:10px;right:10px;top:10px;bottom:0;border-radius:999px 999px 0 0;background:radial-gradient(ellipse at 50% 85%,#ffe9bd,#e3b068 48%,#4d3213)}
.plq .lf{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;aspect-ratio:1/1.5;padding:0 10% 11%;border-radius:999px 999px 0 0;transform-origin:left center;transition:transform .7s cubic-bezier(.5,0,.2,1);background:repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 2px,transparent 2px 18px),linear-gradient(180deg,#27665a,#10352c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -50px 70px rgba(0,0,0,.28)}
.plq.open .lf{transform:rotateY(-100deg)}
.plq .no{position:absolute;top:14%;left:0;right:0;font:800 clamp(56px,18vw,76px)/1 var(--serif);color:transparent;-webkit-text-stroke:1.5px rgba(247,241,230,.75)}
.plq b{font-family:var(--serif);font-weight:800;font-size:clamp(19px,5.6vw,23px);line-height:1.05;text-transform:uppercase;letter-spacing:-.01em}
.plq em{font-style:normal;font-size:12px;line-height:1.35;color:rgba(247,241,230,.82)}
.plq .tp{margin-top:6px;padding:4px 12px;border:1px solid rgba(247,241,230,.5);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.plq .kn{position:absolute;right:11%;top:56%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbc4b6 55%,#6d675c)}
.rmq{position:absolute;z-index:8;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));overflow:hidden;opacity:0;transition:opacity 1s;pointer-events:none}
.rm.lit .rmq{opacity:1}
.rmq div{display:flex;width:max-content;animation:mq 34s linear infinite}
.rmq span{padding-right:2em;font:800 11px var(--serif);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.dark{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at 50% 22%,rgba(10,8,6,.3) 0,rgba(4,3,2,.96) 55%);transition:opacity .5s}
.dark.on{animation:lon 1.5s both}
@keyframes lon{0%{opacity:1}8%{opacity:.35}14%{opacity:.95}22%{opacity:.2}30%{opacity:.8}42%,100%{opacity:0}}
.cord{position:absolute;z-index:8;left:50%;top:0;width:44px;margin-left:-22px;display:flex;flex-direction:column;align-items:center;touch-action:none;transition:opacity .6s}
.fix{width:60px;height:12px;border-radius:0 0 10px 10px;background:linear-gradient(#586278,#222a3b)}
.cl{width:3px;height:calc(120px + var(--pull,0px));background:linear-gradient(90deg,#8a8378,#f4efe6,#8a8378);transition:height .45s cubic-bezier(.3,1.7,.5,1)}
.cord.drag .cl{transition:none}
.bead{position:relative;width:32px;height:32px;margin-top:-2px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab4c6 55%,#454f64);box-shadow:0 5px 10px rgba(0,0,0,.55);touch-action:none;cursor:grab}
.bead::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--led2);animation:ping 1.7s ease-out infinite}
.cord.done{opacity:0;pointer-events:none}
.hint2{position:absolute;z-index:9;left:0;right:0;top:48%;padding:0 24px;text-align:center;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.35;text-shadow:0 2px 12px var(--wall2);transition:opacity .5s;pointer-events:none}
.hud{position:absolute;z-index:9;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.pill{pointer-events:auto;display:inline-block;flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:700;white-space:nowrap}
.nav{position:absolute;z-index:9;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .8s}
.nav::-webkit-scrollbar{display:none}
.rm.lit .nav{opacity:1;pointer-events:auto}
.nav .pill{transition:background .35s,color .35s,transform .35s}
.nav .pill.on{background:var(--accent);color:var(--btntext);border-color:var(--accent);transform:scale(1.06)}
/* pages */
.pw{position:fixed;inset:0;z-index:50;display:none;perspective:1400px}
.pw.on{display:block}
.bd{position:absolute;inset:0;background:var(--dim);touch-action:none}
.pn{position:absolute;left:12px;right:12px;max-width:720px;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;background:var(--paper);color:var(--pi);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.pgh{position:relative;flex:none;padding:16px 18px 0 20px;color:#f7f1e6;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 18px),linear-gradient(180deg,#27665a,#10352c)}
.pno{position:absolute;right:-4px;top:-10px;font:800 120px/1 var(--serif);color:transparent;-webkit-text-stroke:1.5px rgba(247,241,230,.26);pointer-events:none}
.pgh h2{position:relative;overflow:hidden;padding:6px 52px 8px 0;font-family:var(--serif);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:-.02em;text-transform:uppercase}
.x{position:absolute;right:12px;top:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid rgba(247,241,230,.55);color:#f7f1e6;font-size:17px;line-height:1}
.mq{position:relative;overflow:hidden;margin:4px -18px 0 -20px;padding:9px 0;border-top:1px solid rgba(247,241,230,.2)}
.mq div{display:flex;width:max-content;animation:mq 26s linear infinite}
.mq span{padding-right:2em;font:800 11px var(--serif);letter-spacing:.26em;text-transform:uppercase;color:rgba(247,241,230,.82);white-space:nowrap}
.pb{flex:1;min-height:0;overflow:auto;padding:20px 20px 28px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ch{display:inline-block;transform:translateY(115%);opacity:0;animation:chin .75s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--k)*38ms + 260ms)}
@keyframes chin{to{transform:none;opacity:1}}
.w{display:inline-block;opacity:0;transform:translateY(12px);animation:rvx .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--k)*30ms + 380ms)}
.rv{opacity:0;transform:translateY(24px);animation:rvx .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 380ms)}
.fl{transform:translateX(-36px)}.fr{transform:translateX(36px)}
@keyframes rvx{to{opacity:1;transform:none}}
.lead{font-weight:500;font-size:clamp(17px,4.2vw,19px);line-height:1.7}
.t{padding:16px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--pi) 4%,transparent)}
.t h3{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.3}
.t p,.t li{color:var(--muted);font-size:15px}
.t small{display:block;margin-bottom:2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.t ul{margin:8px 0 0;padding-left:18px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 14px}
.st{padding:14px 4px;text-align:center;border-radius:14px;background:var(--soft)}
.st b{display:block;font-family:var(--serif);font-size:32px;font-weight:800;line-height:1.1;color:var(--accent)}
.st span{font-size:12.5px;font-weight:600;color:var(--muted)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent);transform-origin:top;animation:grow 1.4s .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.tl .t{position:relative}
.tl .t::before{content:"";position:absolute;left:-27px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.yr{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;color:transparent;-webkit-text-stroke:1.2px var(--accent)}
.pillb{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}
.mrow{margin-bottom:18px}
.mrow h3{font-family:var(--serif);font-weight:800;font-size:17px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em}
.mview{overflow:hidden;margin:0 -20px;padding:4px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;gap:8px;width:max-content;animation:mq 24s linear infinite}
.mrow.rev .mtrack{animation-direction:reverse;animation-duration:30s}
.chp{flex:none;padding:8px 16px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:700;white-space:nowrap}
.hobs{display:grid;gap:12px}
@media(min-width:600px){.hobs{grid-template-columns:repeat(3,1fr)}}
.hob{text-align:center;padding:22px 12px;margin:0}
.hob .em{display:block;font-size:46px;line-height:1.2;animation:bobe 3s ease-in-out infinite}
.hob:nth-child(2) .em{animation-delay:-1s}.hob:nth-child(3) .em{animation-delay:-2s}
@keyframes bobe{50%{transform:translateY(-8px) rotate(-5deg)}}
.acts2{display:grid;gap:12px}
@media(min-width:600px){.acts2{grid-template-columns:repeat(2,1fr)}}
.acts2 .t{margin:0;position:relative;overflow:hidden}
.acts2 .t::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:ul 1s 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ul{to{transform:scaleX(1)}}
.bigmail{display:block;overflow:hidden;margin:8px 0 20px;padding-bottom:6px;border-bottom:2px solid var(--accent);font-family:var(--serif);font-weight:800;font-size:clamp(17px,5.4vw,26px);letter-spacing:-.01em;color:var(--accent);word-break:break-all;text-decoration:none}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 20px;border-radius:12px;background:var(--accent);color:var(--btntext)!important;font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid var(--accent);transition:transform .25s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--pi)!important;border-color:var(--line)}
.pgn{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.moment{overflow:hidden;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:color-mix(in srgb,var(--pi) 4%,transparent)}
.moment.wide{grid-column:1/-1}
.moment img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;animation:kb 10s ease-in-out infinite alternate}
.moment.wide img{aspect-ratio:auto}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.moment figcaption{padding:12px 14px 14px;background:var(--paper);position:relative}
.moment small{display:block;color:var(--accent);font-weight:800;font-size:13px}
.moment p{margin-top:2px;color:var(--muted);font-size:14px;line-height:1.55}
.lb{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(5,5,4,.92);cursor:pointer;animation:fade .3s both}
.lb[hidden]{display:none}
.lb img{max-width:92vw;max-height:68vh;border-radius:14px;animation:zin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{transform:scale(.88);opacity:0}}
.lb p{color:#eee8dc;text-align:center;max-width:32em;font-size:15px}
.lb span{color:#a9a090;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv,.ch,.w{opacity:1!important;transform:none!important}}

/* ===== background type in motion ===== */
.hbg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;padding:5vh 0 15vh;pointer-events:none;overflow:hidden}
.hrow{overflow:hidden;white-space:nowrap;line-height:1}
.ht{display:inline-flex;width:max-content;animation:mq var(--d,60s) linear infinite;will-change:transform}
.ht span{padding-right:.4em;font:800 clamp(64px,19vw,118px)/1 var(--serif);letter-spacing:-.04em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 15%,transparent)}
.ht span.f{color:color-mix(in srgb,var(--accent) 17%,transparent);-webkit-text-stroke:0}
.rev .ht{animation-direction:reverse}
.sun{animation:breathe 7s ease-in-out infinite}
.sun::after{content:"";position:absolute;inset:6%;border:1.5px dashed color-mix(in srgb,var(--accent) 42%,transparent);border-radius:50%;animation:spin 40s linear infinite}
@keyframes breathe{50%{transform:translate(-50%,-58%) scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fdot{position:absolute;z-index:0;border-radius:50%;pointer-events:none;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);animation:fup linear infinite}
.fdot.s{background:color-mix(in srgb,var(--accent) 35%,transparent);border:0}
@keyframes fup{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-75vh);opacity:0}}
.srow{position:absolute;left:-30vw;right:-30vw;overflow:hidden;white-space:nowrap;line-height:1;pointer-events:none}
.srow.s1{top:13%;transform:translateX(calc((var(--i)*100vw - var(--sl,0px))*.25))}
.srow.s2{top:30%;transform:translateX(calc((var(--i)*100vw - var(--sl,0px))*.42))}
.srow .ht span{font-size:clamp(54px,16vw,100px)}
.seg .ht{animation-play-state:paused}
.seg.nr .ht{animation-play-state:running}
.orb::after{content:"";position:absolute;inset:7%;border:1.5px dashed color-mix(in srgb,var(--accent) 40%,transparent);border-radius:50%;animation:spin 46s linear infinite}
.lamp{transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.plq::after{content:"";position:absolute;left:10px;right:10px;top:10px;bottom:0;border-radius:999px 999px 0 0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.22) 49%,transparent 60%) 130% 0/260% 100% no-repeat;animation:shine 6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,35%{background-position:130% 0}75%,100%{background-position:-130% 0}}
.pgbg{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;justify-content:space-around;padding:150px 0 24px;overflow:hidden;pointer-events:none}
.pgbg .ht span{font-size:clamp(46px,13vw,76px);-webkit-text-stroke-color:color-mix(in srgb,var(--pi) 10%,transparent)}
.pgbg .ht span.f{color:color-mix(in srgb,var(--accent) 10%,transparent)}
.pgh{z-index:2}
.pb{position:relative;z-index:1}
.bigmail .ch{animation:chin .75s cubic-bezier(.2,.8,.2,1) forwards,wave 2.8s calc(var(--k)*90ms + 1.4s) ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-4px)}}

/* ===== readability over moving type ===== */
.pb{background:color-mix(in srgb,var(--paper) 72%,transparent);padding:18px 18px 28px}
.pgbg .ht span{-webkit-text-stroke-color:color-mix(in srgb,var(--pi) 8%,transparent)}
.pgbg .ht span.f{color:color-mix(in srgb,var(--accent) 8%,transparent)}
.t,.moment{background:var(--paper);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.t{border-color:var(--line)}
.lead{padding:16px 18px;margin-bottom:4px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.st{background:color-mix(in srgb,var(--accent) 10%,var(--paper));border:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.mrow{padding:14px 14px 10px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.mview{margin:0 -14px}
.chp{background:color-mix(in srgb,var(--accent) 14%,var(--paper))}
.bigmail{padding:12px 14px;border:1px solid var(--line);border-bottom:2px solid var(--accent);border-radius:14px;background:var(--paper)}
.btn.ghost{background:var(--paper)}
.pillb{background:color-mix(in srgb,var(--accent) 14%,var(--paper))}
.hint{padding:11px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.hint2{left:50%;right:auto;width:max-content;max-width:86vw;transform:translateX(-50%);padding:12px 20px;border-radius:14px;background:var(--glass);border:1px solid var(--line);text-shadow:none}
.rmq{padding:5px 0;background:color-mix(in srgb,var(--wall2) 82%,transparent)}
.cap{padding:4px 10px;border-radius:999px;background:var(--glass)}

/* ===== border light and text transitions ===== */
.t,.st,.mrow,.lead,.moment,.bigmail{position:relative}
.bdr{position:absolute;inset:0;z-index:3;border-radius:inherit;padding:1.5px;pointer-events:none;overflow:hidden;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.bdr::before{content:"";position:absolute;inset:-150%;background:conic-gradient(from 0deg,transparent 0 58%,color-mix(in srgb,var(--accent) 90%,transparent) 80%,color-mix(in srgb,#fff 65%,var(--accent)) 88%,transparent 92%,transparent);animation:spin 5.5s linear infinite;animation-delay:var(--dl,0s)}
/* text only animates after the page is visible */
.ch,.w,.rv{animation:none;opacity:1;transform:none}
.pre .ch{opacity:0;transform:translateY(115%)}
.pre .w{opacity:0;transform:translateY(12px)}
.pre .rv{opacity:0;transform:translateY(24px)}
.pre .rv.fl{transform:translateX(-36px)}
.pre .rv.fr{transform:translateX(36px)}
.go .ch{animation:chin .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*38ms + 200ms)}
.go .w{animation:rvx2 .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*30ms + 320ms)}
.go .rv{animation:rvx2 .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*85ms + 320ms)}
@keyframes rvx2{from{opacity:0;transform:translate(var(--fx,0),var(--fy,24px))}to{opacity:1;transform:none}}
.rv{--fx:0px;--fy:24px}.rv.fl{--fx:-36px;--fy:0px}.rv.fr{--fx:36px;--fy:0px}
.pre .t>*,.pre .moment figcaption>*,.pre .st>*{opacity:0;transform:translateY(14px)}
.go .t>*,.go .moment figcaption>*,.go .st>*{animation:txup .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*85ms + 560ms + var(--c,0)*90ms)}
.t>*:nth-child(2),.moment figcaption>*:nth-child(2),.st>*:nth-child(2){--c:1}
.t>*:nth-child(3){--c:2}.t>*:nth-child(4){--c:3}.t>*:nth-child(5){--c:4}
@keyframes txup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bigmail.sc .ch{animation:chin .75s cubic-bezier(.2,.8,.2,1) both,wave 2.8s calc(var(--k)*90ms + 1.6s) ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pre *{opacity:1!important;transform:none!important}}
</style>
</head>

 +'<button class="plq" type="button" data-open="'+id+'" aria-label="Open '+names[id]+'"><span class="gl"></span><span class="lf"><span class="no">0'+(j+1)+'</span><b>'+names[id]+'</b><em>'+subs[id]+'</em><span class="tp">Tap to open</span><span class="kn"></span></span></button></div>'});
track.innerHTML=h;
order.forEach(function(id,j){var b=document.createElement('button');b.className='pill';b.type='button';b.setAttribute('data-to',j);b.textContent=names[id];nav.appendChild(b)});
var chips=[].slice.call(nav.querySelectorAll('.pill')),segs=[].slice.call(track.querySelectorAll('.seg')),curSeg=-1;
var rq=['Mathematics','Design','Video Editing','Football','Travel','Gaming'];
var gs=rq.map(function(t){return '<span>'+t+' /</span>'}).join('')+rq.map(function(t){return '<span>'+t+' /</span>'}).join('');
$('rmq').innerHTML='<div>'+gs+gs+'</div>';
function goTo(j){track.scrollTo({left:j*track.clientWidth,behavior:rm?'auto':'smooth'})}
chips.forEach(function(c){c.addEventListener('click',function(){if(lit)goTo(+c.getAttribute('data-to'))})});
var tick=false;
function mark(){tick=false;track.style.setProperty('--sl',track.scrollLeft+'px');
 var j=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
 if(!lit)return;
 if(j!==curSeg){curSeg=j;segs.forEach(function(s,k){s.classList.toggle('cur',k===j);s.classList.toggle('nr',Math.abs(k-j)<=1)});chips.forEach(function(c,k){c.classList.toggle('on',k===j)});
  var cc=chips[j];if(cc&&nav.scrollTo)nav.scrollTo({left:Math.max(0,cc.offsetLeft-60),behavior:'auto'})}
 if(track.scrollLeft>20)$('hint2').style.opacity=0}
track.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(mark)}},{passive:true});

/* enter and leave */
function enter(){if(busy)return;busy=true;door.classList.add('open');
 setTimeout(function(){hall.classList.add('fade')},rm?0:900);
 setTimeout(function(){sd.classList.remove('on');sr.classList.add('on');html.classList.add('inroom');resetRoom();busy=false},rm?0:1500)}
door.addEventListener('click',enter);
$('back').addEventListener('click',function(){closePanel(true);sr.classList.remove('on');sd.classList.add('on');
 door.classList.remove('open');hall.classList.remove('fade');html.classList.remove('inroom');window.scrollTo(0,0)});

/* pull cord */
var cord=$('cord'),bead=$('bead'),dark=$('dark'),hint2=$('hint2'),sy=0,dragC=false,movedC=0;
function setPull(v){cord.style.setProperty('--pull',v+'px')}
function resetRoom(){lit=false;curSeg=-1;rmEl.classList.remove('lit');dark.classList.remove('on');dark.style.opacity='';cord.classList.remove('done');setPull(0);
 segs.forEach(function(s){s.classList.remove('cur');s.classList.remove('nr')});chips.forEach(function(c){c.classList.remove('on')});
 track.classList.add('lock');track.scrollLeft=0;track.style.setProperty('--sl','0px');hint2.innerHTML='Pull the cord down<br>to switch on the lights';hint2.style.opacity=1}
function lightsOn(){if(lit)return;lit=true;setPull(80);setTimeout(function(){setPull(0);cord.classList.add('done')},160);
 dark.classList.add('on');rmEl.classList.add('lit');
 setTimeout(function(){dark.style.opacity=0;track.classList.remove('lock');hint2.innerHTML='Swipe left to walk along the wall';mark()},rm?0:1500)}
bead.addEventListener('pointerdown',function(e){if(lit)return;dragC=true;movedC=0;sy=e.clientY;cord.classList.add('drag')});
bead.addEventListener('pointermove',function(e){if(!dragC)return;var d=Math.max(0,Math.min(110,(e.clientY-sy)*.85));movedC=Math.max(movedC,d);setPull(d)});
function endC(){if(!dragC)return;dragC=false;cord.classList.remove('drag');if(movedC>46||movedC<6)lightsOn();else setPull(0)}
bead.addEventListener('pointerup',endC);bead.addEventListener('pointercancel',function(){dragC=false;cord.classList.remove('drag');setPull(0)});
bead.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();lightsOn()}});

/* kinetic type helpers */
function chars(el){var t=el.textContent;el.setAttribute('aria-label',t);el.textContent='';t.split('').forEach(function(c,k){var s=document.createElement('span');s.className='ch';s.style.setProperty('--k',k);s.setAttribute('aria-hidden','true');s.textContent=c===' '?'\u00a0':c;el.appendChild(s)})}
function words(el){var t=el.textContent.trim().split(/\s+/);el.textContent='';t.forEach(function(w,k){var s=document.createElement('span');s.className='w';s.style.setProperty('--k',k);s.textContent=w;el.appendChild(s);el.appendChild(document.createTextNode(' '))})}
function count(v){v.querySelectorAll('.cnt').forEach(function(e){var to=+e.getAttribute('data-to'),dec=+e.getAttribute('data-dec')||0,t0=null;
 if(rm){e.textContent=to.toFixed(dec);return}e.textContent=(0).toFixed(dec);
 function s(t){if(!t0)t0=t;var p=Math.min((t-t0)/1300,1),k=1-Math.pow(1-p,3);e.textContent=(to*k).toFixed(dec);if(p<1)requestAnimationFrame(s)}
 setTimeout(function(){requestAnimationFrame(s)},500)})}

/* pages */
var pw=$('pw'),pn=$('pn'),pb=$('pb'),bd=$('bd'),from='',openSrc=null;
function openPanel(id,src){if(isOpen||!lit)return;isOpen=true;openSrc=src;
 var j=order.indexOf(id);
 pn.classList.remove('go');pn.classList.add('pre');pb.innerHTML='';pb.appendChild($('c-'+id).content.cloneNode(true));pb.scrollTop=0;
 pb.querySelectorAll('.moment').forEach(function(m){m.classList.add('rv')});
 pb.querySelectorAll('.sw').forEach(words);pb.querySelectorAll('.sc').forEach(chars);
 pb.querySelectorAll('.mtrack').forEach(function(t){t.innerHTML+=t.innerHTML});
 var nx=order[j+1],g=document.createElement('div');g.className='pgn rv';
 g.innerHTML='<button class="btn ghost" type="button" data-act="close">Back to the wall</button>'+(nx?'<button class="btn" type="button" data-act="next" data-next="'+(j+1)+'">Next: '+names[nx]+'</button>':'');pb.appendChild(g);
 pb.querySelectorAll('.rv').forEach(function(e,k){e.style.setProperty('--i',k)});
 pb.querySelectorAll('.t,.st,.mrow,.lead,.moment,.bigmail').forEach(function(e,k){var b=document.createElement('i');b.className='bdr';b.style.setProperty('--dl','-'+(k*.9)+'s');e.appendChild(b)});
 $('pt').textContent=names[id];chars($('pt'));$('pno').textContent='0'+(j+1);
 var WW=names[id].split(' ')[0];$('pgbg').innerHTML=[0,1,2,3,4].map(function(i){return '<div class="hrow'+(i%2?' rev':'')+'" style="--d:'+(40+i*8)+'s">'+ht(i%2?['Shamim',WW,'Hossain',WW]:[WW,'Portfolio',WW,'2026'],i===1||i===3)+'</div>'}).join('');
 var m=(mqs[id]||[]).map(function(t){return '<span>'+t+' /</span>'}).join('');$('mqi').innerHTML=m+m+m+m;
 var cp=$('copy');if(cp)cp.addEventListener('click',function(){var t='masaudshamim329@gmail.com';
  try{navigator.clipboard.writeText(t).then(function(){cp.textContent='Copied'},function(){cp.textContent=t})}catch(e){cp.textContent=t}
  setTimeout(function(){cp.textContent='Copy email'},2200)});
 var isDoor=src&&src.classList.contains('plq');if(isDoor)src.classList.add('open');
 setTimeout(function(){
  pw.classList.add('on');
  var r=pn.getBoundingClientRect(),b=src.getBoundingClientRect();
  from='translate('+(b.left+b.width/2-r.left-r.width/2)+'px,'+(b.top+b.height/2-r.top-r.height/2)+'px) scale('+Math.min(1,Math.max(.1,b.width/r.width))+','+Math.min(1,Math.max(.06,b.height/r.height))+')';
  if(pn.animate&&!rm){pn.animate([{opacity:0,transform:from},{opacity:1,transform:'none'}],{duration:560,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
   bd.animate([{opacity:0},{opacity:1}],{duration:360,fill:'both'})}
  requestAnimationFrame(function(){requestAnimationFrame(function(){pn.classList.remove('pre');pn.classList.add('go')})});count(pb);try{$('x').focus({preventScroll:true})}catch(e){}},isDoor&&!rm?460:0)}
function closePanel(now,cb){if(!isOpen)return;isOpen=false;var s=openSrc;
 function done(){pw.classList.remove('on');if(pn.getAnimations)pn.getAnimations().forEach(function(a){a.cancel()});if(bd.getAnimations)bd.getAnimations().forEach(function(a){a.cancel()});if(s&&s.classList)s.classList.remove('open');if(cb)cb()}
 if(pn.animate&&!now&&!rm){var a=pn.animate([{opacity:1,transform:'none'},{opacity:0,transform:from||'scale(.3)'}],{duration:380,easing:'ease-in',fill:'forwards'});
  bd.animate([{opacity:1},{opacity:0}],{duration:380,fill:'forwards'});a.onfinish=done}else done()}
document.addEventListener('click',function(e){var o=e.target.closest('[data-open]');if(o){openPanel(o.getAttribute('data-open'),o);return}
 var a=e.target.closest('[data-act]');if(a){if(a.getAttribute('data-act')==='next'){var n=+a.getAttribute('data-next');closePanel(false,function(){goTo(n)})}else closePanel()}});
$('x').addEventListener('click',function(){closePanel()});
bd.addEventListener('click',function(){closePanel()});

/* photo viewer */
var lb=$('lb'),im=lb.querySelector('img'),tx=lb.querySelector('p');
function openLb(f){var s=f.querySelector('img');im.src=s.src;im.alt=s.alt;tx.textContent=f.querySelector('small').textContent+': '+f.querySelector('p').textContent;lb.hidden=false}
document.addEventListener('click',function(e){var f=e.target.closest('.moment');if(f)openLb(f)});
lb.addEventListener('click',function(){lb.hidden=true});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(!lb.hidden)lb.hidden=true;else closePanel()}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('moment')){e.preventDefault();openLb(e.target)}});
})();
</script>
